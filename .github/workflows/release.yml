name: Build & Release SpotifyIsland

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore SpotifyIsland.csproj

      - name: Publish self-contained EXE
        run: |
          dotnet publish SpotifyIsland.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o ./dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyIsland-win-x64
          path: dist/SpotifyIsland.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/SpotifyIsland.exe
          name: SpotifyIsland ${{ github.ref_name }}
          body: |
            ## 🏝️ SpotifyIsland ${{ github.ref_name }}
            
            **No installation required** — download and run.
            
            ### What's new
            See [CHANGELOG](CHANGELOG.md) for details.
            
            ### Requirements
            - Windows 10 (build 19041+) or Windows 11
            - Spotify Desktop app
            
            ### How to use
            1. Download `SpotifyIsland.exe`
            2. Double-click to run
            3. Look for the 🏝️ icon in your system tray
            4. Open Spotify — the island activates automatically!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
